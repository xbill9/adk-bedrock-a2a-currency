[project]
name = "benchmark-adk-coordinator"
version = "0.2.0"
description = "Google ADK master agent coordinating MCP and an AWS AgentCore A2A worker"
requires-python = ">=3.13"
dependencies = [
    "google-adk[a2a]==2.5.0",
    # A2A *client* of the AgentCore worker, and an A2A *server* via ADK's
    # to_a2a(). [http-server] is required for the server half: ADK's route
    # attachment imports a2a.server.routes, which needs sse_starlette, and
    # google-adk[a2a] does not pull that in. Without it the container dies at
    # startup with ModuleNotFoundError: No module named 'sse_starlette'.
    "a2a-sdk[http-server]>=1.1,<2",
    # SigV4 signing only; the STS web-identity exchange needs no AWS SDK.
    "botocore>=1.35",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.35.0",
    "httpx>=0.28.1",
    "pydantic>=2.10",
]
