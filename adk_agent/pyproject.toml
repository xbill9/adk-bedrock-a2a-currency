[project]
name = "benchmark-adk-agent"
version = "0.1.0"
description = "Minimal Google ADK currency agent exposed over A2A v1.0 for the interoperability benchmark"
requires-python = ">=3.13"
dependencies = [
    "google-adk[a2a]==2.5.0",
    "a2a-sdk>=1.1,<2",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.35.0",
    "mcp>=1.28.1",
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
]
